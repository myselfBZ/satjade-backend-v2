version: "2"
sql:
  - schema: "cmd/migrate/migrations"
    queries: 
     - "internal/queries/*.sql"
    engine: "postgresql"
    gen:
      go:
        package: "db" 
        out: "internal/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "difficulty"
            go_type: "string"

